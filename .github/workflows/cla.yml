name: Contributor license agreement

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || 'refresh' }}
  cancel-in-progress: false

jobs:
  agreement:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Always use trusted default-branch code. Never check out a PR head here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/cla.test.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const { check } = require('./.github/scripts/cla.cjs');
            await check({ github, context, core });
