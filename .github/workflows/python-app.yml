name: Legacy Python regression

on:
  push:
    branches: [main]
    paths: ['workbench/**', 'test_*.py', 'requirements.txt', '.github/workflows/python-app.yml']
  pull_request:
    branches: [main]
    paths: ['workbench/**', 'test_*.py', 'requirements.txt', '.github/workflows/python-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Run root regression tests (Windows GUI and DPAPI required)
        shell: pwsh
        run: |
          $tests = Get-ChildItem -File test_*.py | ForEach-Object { $_.Name }
          python -m pytest -q @tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
