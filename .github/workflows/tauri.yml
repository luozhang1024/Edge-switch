name: Tauri desktop checks

on:
  push:
    branches: [main]
    tags: ['v2.*', 'publish/v2.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: 'true'
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - run: npx prettier --check src scripts package.json tsconfig.json vite.config.ts vitest.config.ts src-tauri/tauri.conf.json src-tauri/capabilities/main.json
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --lib -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME -replace '^publish/', ''
          if ($tag -ne "v$version") { throw 'Tag does not match source version' }
          if ($env:GITHUB_REF_NAME.StartsWith('publish/')) {
            # A retry may repair build scripts, but must preserve the tagged app sources.
            git diff --exit-code $tag HEAD -- src src-tauri package.json package-lock.json image
            if ($LASTEXITCODE -ne 0) { throw 'Application sources differ from the release tag' }
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Build installer and portable archive
        run: npm run desktop:build
      - name: Exercise packaged desktop through WebView2
        run: npm run test:desktop
      - name: Publish verified prerelease assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          git archive --format=zip --output="dist/tauri/EdgeSwitch-$($tag.TrimStart('v'))-source.zip" $tag
          $assets = Get-ChildItem 'dist/tauri' -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $lines = $assets | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/tauri/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
          $uploads = @($assets | ForEach-Object { $_.FullName }) + @((Resolve-Path 'dist/tauri/SHA256SUMS.txt').Path)
          gh release create $tag @uploads --verify-tag --prerelease --title "Edge Switch $tag" --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-switch-windows-alpha
          path: |
            dist/tauri/*
            build/tauri-build.log
            build/migration/desktop-*/result.json
            build/migration/desktop-*/*.png
          if-no-files-found: warn
